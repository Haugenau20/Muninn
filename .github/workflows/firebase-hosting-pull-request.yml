# .github/workflows/firebase-hosting-pull-request.yml

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  # Runs for every PR, forks included: it needs no secrets.
  test:
    uses: ./.github/workflows/test.yml

  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      # The install the `test` job checked: exactly the lockfile (T107). The
      # site used to be built inside a Docker image with `npm install`, which
      # ignores the lockfile, and then copied out of it -- so what shipped was
      # not what CI had tested.
      - name: Install dependencies
        run: npm ci

      # vite.config.ts reads REACT_APP_* from the environment, ahead of any .env file.
      - name: Build
        run: npm run build
        env:
          REACT_APP_USE_EMULATORS: "false"
          # A preview runs unmerged code against production data, so it stays
          # signed out on purpose; this makes /signin and /join say so (T110).
          # The live deploy (firebase-hosting-merge.yml) must never set it.
          REACT_APP_PREVIEW: "true"
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_AUTH_DOMAIN: ${{ secrets.REACT_APP_AUTH_DOMAIN }}
          REACT_APP_PROJECT_ID: ${{ secrets.REACT_APP_PROJECT_ID }}
          REACT_APP_STORAGE_BUCKET: ${{ secrets.REACT_APP_STORAGE_BUCKET }}
          REACT_APP_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}
          REACT_APP_APP_ID: ${{ secrets.REACT_APP_APP_ID }}
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}

      # firebase/firebase.json serves `build`, relative to the entryPoint below.
      - name: Place the build for Firebase
        run: |
          mkdir -p firebase/build
          cp -r build/* firebase/build/

      # Deploy to Firebase Hosting: a preview channel on the site muninn.quest is
      # served from, not the default site, which is to become a redirect (T118).
      # The cleanup workflow looks for channels on both.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CAMPAIGN_COMPANION }}
          projectId: dnd-campaign-companion
          target: muninn-quest
          entryPoint: ./firebase