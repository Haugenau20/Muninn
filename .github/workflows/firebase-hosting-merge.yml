# .github/workflows/firebase-hosting-merge.yml

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
# Two merges in quick succession must not deploy over each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Functions first: a new page must never reach users before the function it
  # calls. Unchanged functions are skipped by the CLI, so most runs are quick.
  # Deploys with its own service account (FIREBASE_FUNCTIONS_DEPLOY_SA), not the
  # Hosting one. `--only functions` leaves the rules to `deploy_rules`.
  #
  # Fails, and so holds back Hosting, when: prod has a function that the source
  # no longer exports (delete it by hand: `firebase functions:delete`), or the
  # region has no Artifact Registry cleanup policy (set it once with
  # `firebase functions:artifacts:setpolicy --location europe-west1`).
  deploy_functions:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      # firebase.json's predeploy builds the functions, which needs these.
      - name: Install function dependencies
        run: npm ci --prefix firebase/functions

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SA }}

      - name: Deploy functions
        working-directory: firebase
        run: npx firebase deploy --only functions --project dnd-campaign-companion --non-interactive

  # Then the Firestore and Storage rules (T105), from the files firebase.json
  # names: firestore.rules.prod and storage.rules.prod. After the functions, so
  # a rule may rely on a function that is already live; before Hosting, so the
  # frontend may rely on a rule. A rule that must follow the frontend instead
  # ships in a later merge (see the header of firestore.rules.prod).
  #
  # Same service account as the functions, which needs three more roles on the
  # project; without them this job fails and holds back Hosting. What the CLI
  # 15.22.4 checks or calls (lib/commands/deploy.js, lib/gcp/storage.js):
  #   - Firebase Rules Admin (roles/firebaserules.admin): creating and
  #     releasing both rulesets.
  #   - Cloud Datastore Index Admin (roles/datastore.indexAdmin): the CLI's
  #     pre-check asks for the `firestore` target's index permissions even
  #     when only `firestore:rules` is deployed. No index is deployed.
  #   - Cloud Storage for Firebase Viewer (roles/firebasestorage.viewer): the
  #     Storage deploy looks up the default bucket.
  # The CLI skips a ruleset identical to the live one.
  deploy_rules:
    needs: [test, deploy_functions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      # firestore.rules and storage.rules are the permissive EMULATOR rulesets.
      # A firebase.json that named either would deploy open data; refuse it.
      - name: Refuse anything but the production rulesets
        working-directory: firebase
        run: |
          node -e '
            const config = require("./firebase.json");
            const firestore = config.firestore && config.firestore.rules;
            const storage = config.storage && config.storage.rules;
            if (firestore !== "firestore.rules.prod" || storage !== "storage.rules.prod") {
              console.error(`firebase.json must name firestore.rules.prod and storage.rules.prod; it names ${firestore} and ${storage}.`);
              process.exit(1);
            }
          '

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SA }}

      - name: Deploy rules
        working-directory: firebase
        run: npx firebase deploy --only firestore:rules,storage --project dnd-campaign-companion --non-interactive

  # Merging deploys live, so a red suite must stop the deploy, not just report.
  build_and_deploy:
    needs: [test, deploy_functions, deploy_rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      # The install the `test` job checked: exactly the lockfile (T107). The
      # site used to be built inside a Docker image with `npm install`, which
      # ignores the lockfile, and then copied out of it -- so what shipped was
      # not what CI had tested.
      - name: Install dependencies
        run: npm ci

      # vite.config.ts reads REACT_APP_* from the environment, ahead of any .env file.
      - name: Build
        run: npm run build
        env:
          REACT_APP_USE_EMULATORS: "false"
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
          REACT_APP_AUTH_DOMAIN: ${{ secrets.REACT_APP_AUTH_DOMAIN }}
          REACT_APP_PROJECT_ID: ${{ secrets.REACT_APP_PROJECT_ID }}
          REACT_APP_STORAGE_BUCKET: ${{ secrets.REACT_APP_STORAGE_BUCKET }}
          REACT_APP_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}
          REACT_APP_APP_ID: ${{ secrets.REACT_APP_APP_ID }}
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}

      # firebase/firebase.json serves `build`, relative to the entryPoint below.
      - name: Place the build for Firebase
        run: |
          mkdir -p firebase/build
          cp -r build/* firebase/build/

      # Deploy to Firebase Hosting. No `target`, so every site in firebase.json:
      # `muninn-quest` (muninn.quest), which serves the build, and the default
      # `dnd-campaign-companion`, which only redirects and uploads
      # `firebase/redirect-site/` (T149).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CAMPAIGN_COMPANION }}
          channelId: live
          projectId: dnd-campaign-companion
          entryPoint: ./firebase