# .github/workflows/firebase-hosting-pull-request-cleanup.yml
#
# Deletes Firebase Hosting preview channels that no open PR needs.
#
# `firebase-hosting-pull-request.yml` creates a channel per PR, named
# `pr<number>-<branch>`, and gives it 7 days. Nothing deleted one when its PR
# closed, and a site holds only so many channels: on 2026-09-29 a week of
# stacked PRs filled the quota, and every preview failed with
# `429 ... channel quota reached`.
#
# - On a closed PR: deletes that PR's channel.
# - Run by hand (Actions -> this workflow -> Run workflow): deletes the channel
#   of every PR that is no longer open. That is the way out of a full quota,
#   and only works once this file is on `main`.
name: Delete Firebase Hosting preview channels

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  delete_previews:
    # Fork PRs get no preview (and no secrets), so there is nothing to delete.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      # The repo's pinned CLI, as the functions deploy uses.
      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      # The account the preview deploy already uses. Deleting a channel needs
      # `firebasehosting.sites.update`, which that deploy shows it holds.
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_CAMPAIGN_COMPANION }}

      - name: Delete channels no open PR needs
        working-directory: firebase
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: dnd-campaign-companion
        run: |
          set -euo pipefail

          # Previews were made on the default site until 2026-10 and on
          # `muninn-quest` since (T118), so look on both.
          for site in dnd-campaign-companion muninn-quest; do
            # Channel ids, from full resource names. `live` never matches below.
            ids=$(npx firebase hosting:channel:list --project "$PROJECT" --site "$site" --json \
              | jq -r '.result.channels[].name | split("/") | last')

            for id in $ids; do
              number=$(sed -nE 's/^pr([0-9]+)-.*/\1/p' <<<"$id")
              [ -n "$number" ] || continue

              if [ "$EVENT" = "pull_request" ]; then
                [ "$number" = "$PR_NUMBER" ] || continue
              else
                state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
                if [ "$state" = "OPEN" ]; then
                  echo "Keeping $id on $site: PR #$number is open."
                  continue
                fi
              fi

              npx firebase hosting:channel:delete "$id" --project "$PROJECT" --site "$site" --force
            done
          done
