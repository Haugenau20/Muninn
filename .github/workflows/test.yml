# .github/workflows/test.yml
#
# The checks a merge is supposed to keep green: the type-check (which, unlike
# the build, also covers the test files), lint on the app code with zero
# warnings allowed, lint on the test files against a baseline that may only go
# down, and the jest suite with its 80% coverage floor. Called by
# `pull-request.yml` and the merge-to-main deploy, so both run exactly the
# same gate.
#
# `functions` runs firebase/functions' own suite against the emulators, which
# `firebase emulators:exec` starts and stops around it with the repo's pinned
# CLI (firebase/package.json).
#
# `bundle` runs the production build, which no other job does: it is the only
# resolver that ignores tsconfig `paths`, so an `@/` import passes the type-check
# and jest and fails here. It then holds the entry bundle under its ceiling
# (scripts/check-bundle-size.js, T030).
#
# `e2e` runs the browser journeys (T103, e2e/): Playwright drives the
# production build against emulators that enforce the production Firestore
# rules, started by `npm --prefix firebase run test:e2e`. The ruleset on
# `main` requires `test / e2e` like the other three.
#
# Every job must pass for a caller's `needs: test`, so all four hold back the
# deploy.

name: Test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # App code, zero warnings allowed.
      - name: Lint
        run: npm run lint

      # The test files `npm run lint` skips, held to a per-file baseline that
      # may only go down (scripts/check-test-lint.js).
      - name: Lint test files
        run: npm run lint:tests

      - name: Test
        run: npm run test:ci

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Firestore and Storage-rules emulators are Java.
      - uses: ./.github/actions/toolchain
        with:
          tools: node java

      # The emulator jars are downloaded on first start; they change only with the CLI.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      - name: Install function dependencies
        run: npm ci --prefix firebase/functions

      # What `firebase deploy`'s predeploy runs. The suite type-checks only the
      # files its tests import; this covers the rest.
      - name: Build functions
        run: npm --prefix firebase/functions run build

      - name: Functions suite
        run: npm --prefix firebase run test:functions

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Entry bundle size
        run: npm run check:bundle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The emulators are Java.
      - uses: ./.github/actions/toolchain
        with:
          tools: node java

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install the Firebase CLI
        run: npm ci --prefix firebase

      - name: Install the journeys' dependencies
        run: npm ci --prefix e2e

      # The founder journey calls functions (T127); `test:e2e` builds them for
      # the Functions emulator, which runs their compiled lib/.
      - name: Install the functions' dependencies
        run: npm ci --prefix firebase/functions

      # The browser build follows the pinned @playwright/test version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # `--with-deps` installs the system libraries too, which the cache does
      # not hold, so it runs on a cache hit as well. That runs apt-get, and the
      # runner's first apt mirror (azure.archive.ubuntu.com) sometimes stops
      # answering: apt then waits out its long default timeout on every file,
      # and the job hit its 20 minutes here (2026-10-07, twice; a healthy run
      # takes about 2). The runner reads its mirrors from a list
      # (/etc/apt/apt-mirrors.txt), so a short timeout lets apt give up on the
      # silent one and use the next. The step's own limit fails a hang in
      # minutes, not at the job's.
      - name: Install Chromium
        working-directory: e2e
        timeout-minutes: 8
        run: |
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-fail-fast
          npx playwright install --with-deps chromium

      # Playwright runs the journeys without type-checking them.
      - name: Type-check the journeys
        run: npm --prefix e2e run typecheck

      - name: Journeys
        run: npm --prefix firebase run test:e2e

      # Screenshots, traces (`npx playwright show-trace <zip>`) and the report.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
