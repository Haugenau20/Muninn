# .github/actions/toolchain/action.yml
#
# Node (and Java, where asked) at the versions mise.toml pins, the file every
# machine reads too (T117), plus npm's download cache. Every workflow job that
# runs node uses this instead of actions/setup-node, so a version bump is a
# line in mise.toml and nothing here.
#
# Runs after actions/checkout: it reads mise.toml from the checkout.

name: Toolchain
description: Install the tools mise.toml pins and restore npm's download cache.

inputs:
  tools:
    description: The mise.toml tools to install, space-separated ("node", or "node java" for the emulators).
    default: node

runs:
  using: composite
  steps:
    # Pinned by commit: the deploy jobs run it before they hold credentials,
    # and a moved tag would run new code there unseen.
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        install_args: ${{ inputs.tools }}

    # What setup-node's `cache: npm` did: npm's own download cache, not
    # node_modules, so `npm ci` still installs exactly the lockfile. Keyed per
    # job, since jobs install from different lockfiles and run in parallel.
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-${{ github.job }}-
