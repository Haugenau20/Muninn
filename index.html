<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The header's colour in each theme (surface.chrome.bg), so a phone's
         browser bar runs on from it. index.html cannot read the theme's CSS
         variables; theme-assets.test.ts keeps these in step with the tokens. -->
    <meta name="theme-color" content="#1B1611" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0704" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A shared record for your tabletop campaign: chapters, quests, NPCs, locations and rumours, kept between sessions."
    />
    <!-- The card a chat app draws for a pasted link, join links included. One
         for every page: the site serves this file at every path, and the
         crawlers that read these tags run no JavaScript. The picture comes
         from scripts/build-og-image.js. -->
    <meta property="og:site_name" content="Muninn" />
    <meta property="og:title" content="Muninn" />
    <meta property="og:description" content="Everything your table agreed happened, in one place." />
    <meta property="og:url" content="https://muninn.quest/" />
    <meta property="og:image" content="https://muninn.quest/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Muninn</title>
    <script>
      // Redirect script for client-side routing
      (function() {
        // Check if we need to redirect
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        
        // If we have a stored route
        if (redirect && redirect !== location.href) {
          // Save the route parameter to session storage
          const urlParams = new URLSearchParams(window.location.search);
          const route = urlParams.get('route');
          if (route) {
            // Remove the route parameter and redirect to the actual route
            window.history.replaceState(null, null, '/' + redirect.split('/')[0] + '/' + route);
          }
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
